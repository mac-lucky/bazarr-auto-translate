name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  security-events: write
  actions: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        # setup-uv stopped publishing floating major tags after v7, so this
        # has to be an exact version.
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          # Match the Dockerfile: the script uses PEP 701 f-strings, so the
          # interpreter version is load-bearing.
          python-version: "3.14"

      - name: Lint
        run: uvx ruff check . && uvx ruff format --check .

      - name: Run tests
        run: uv run --locked --group dev pytest tests/ -q

  ci-cd:
    name: Python CI/CD Pipeline
    needs: unit-tests
    uses: mac-lucky/actions-shared-workflows/.github/workflows/python-cicd-reusable.yml@master
    with:
      # Application configuration
      app_name: "bazarr-auto-translate"
      dockerhub_image: "maclucky/bazarr-auto-translate"
      ghcr_image: "ghcr.io/mac-lucky/bazarr-auto-translate"

      # Build configuration
      dockerfile_path: "./Dockerfile"
      build_context: "."

      # Package manager
      use_uv: true

      # Test configuration
      enable_container_tests: true
      enable_kubernetes_tests: false

      # Security and quality
      enable_security_scan: true
      enable_sbom: true
      enable_code_analysis: true
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
