name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        # setup-uv stopped publishing floating major tags after v7, so this
        # has to be an exact version.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"
          # Match the Dockerfile: the script uses PEP 701 f-strings, so the
          # interpreter version is load-bearing.
          python-version: "3.14"

      - name: Run tests
        run: uv run --locked --group dev pytest tests/ -q

  ci-cd:
    name: Python CI/CD Pipeline
    needs: unit-tests
    uses: mac-lucky/actions-shared-workflows/.github/workflows/python-cicd-reusable.yml@master
    # Add permissions for dependabot PRs
    permissions:
      contents: read
      packages: write
      security-events: write
      actions: read
      pull-requests: read
    with:
      # Application configuration
      app_name: "bazarr-auto-translate"
      dockerhub_image: "maclucky/bazarr-auto-translate"
      ghcr_image: "ghcr.io/mac-lucky/bazarr-auto-translate"

      # Build configuration
      dockerfile_path: "./Dockerfile"
      build_context: "."

      # Package manager
      use_uv: true

      # Test configuration
      enable_container_tests: true
      enable_kubernetes_tests: false

      # Security and quality
      enable_security_scan: true
      enable_sbom: true
      enable_code_analysis: true

      # Deployment
      enable_auto_version: true
      push_on_main: true
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
