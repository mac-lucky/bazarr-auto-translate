name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  packages: write
  security-events: write
  actions: read

jobs:
  ci-cd:
    name: Python CI/CD Pipeline
    uses: mac-lucky/actions-shared-workflows/.github/workflows/python-cicd-reusable.yml@master
    with:
      # Application configuration
      app_name: "bazarr-auto-translate"
      dockerhub_image: "maclucky/bazarr-auto-translate"
      ghcr_image: "ghcr.io/mac-lucky/bazarr-auto-translate"

      # Build configuration
      dockerfile_path: "./Dockerfile"
      build_context: "."

      # Package manager
      use_uv: true

      # Test configuration. The reusable's unit-test job replaces the old local
      # gate: pytest comes from the dev dependency group, ruff from the
      # code-analysis matrix (same 0.16.1 pin as the reusable default).
      enable_unit_tests: true
      pytest_args: "tests/ -q"
      enable_container_tests: true
      enable_kubernetes_tests: false

      # Security and quality
      enable_security_scan: true
      enable_sbom: true
      enable_code_analysis: true
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
